<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATM System Eye Feature</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <style>
    button {
      border: 2px solid black;
      border-radius: 5px;
      width: 100px;
      height: 35px;
      cursor: pointer;
      margin-right: 10px;
    }

    body {
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    input {
      width: 200px;
      height: 30px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <div>
    <label>Amount:</label><br />

    <input
      type="number"
      id="amount"
      placeholder="Enter Amount"
    />

    <h3 id="displayPrompt">
      Current Balance: Rs.
      <span id="balanceAmount">10000</span>

      <i
        class="fa-solid fa-eye"
        id="toggleEye"
        style="cursor: pointer"
      ></i>
    </h3>

    <button
      style="background-color: greenyellow"
      onclick="moneyWithdraw()"
    >
      Withdraw
    </button>

    <button
      style="background-color: rgb(124, 75, 238); color: white"
      onclick="moneyDeposit()"
    >
      Deposit
    </button>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Eye Toggle -->
  <script>
    $(document).ready(function () {

      $("#toggleEye").click(function () {

        const balance = $("#balanceAmount");

        if (balance.text() === "****") {

          balance.text(window.currentBalance);

          $(this)
            .removeClass("fa-eye-slash")
            .addClass("fa-eye");

        } else {

          balance.text("****");

          $(this)
            .removeClass("fa-eye")
            .addClass("fa-eye-slash");
        }
      });

    });
  </script>

  <!-- External JS -->
  <script src="index.js"></script>

</body>
</html>
