<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule Pickup — SmartWaste</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
 
<div class="phone-frame">
  <div class="screen-content">
    <div class="page-header">
      <a class="back-btn" href="dashboard.html">←</a>
      <h2 class="page-title">Schedule Pickup</h2>
    </div>
 
    <h3 class="section-heading">Select Waste Type</h3>
    <div class="grid-2 waste-type-grid" id="pickup-waste-type">
      <button class="type-card active" data-value="organic">
        <span class="type-icon">🌿</span><span>Organic</span>
      </button>
      <button class="type-card" data-value="recyclable">
        <span class="type-icon">♻</span><span>Recyclable</span>
      </button>
      <button class="type-card" data-value="general">
        <span class="type-icon">🗑</span><span>General</span>
      </button>
      <button class="type-card" data-value="hazardous">
        <span class="type-icon">⚠</span><span>Hazardous</span>
      </button>
    </div>
 
    <h3 class="section-heading">Pickup Date</h3>
    <div class="input-wrap select-wrap">
      <span class="icon">📅</span>
      <input type="date" id="pickup-date" value="2026-06-19">
    </div>
 
    <h3 class="section-heading">Time Slot</h3>
    <div class="grid-3" id="pickup-time-slot">
      <button class="slot-card active" data-value="morning">
        <div>8-10 AM</div><div class="slot-sub">Morning</div>
      </button>
      <button class="slot-card" data-value="midday">
        <div>11-1 PM</div><div class="slot-sub">Midday</div>
      </button>
      <button class="slot-card" data-value="afternoon">
        <div>2-4 PM</div><div class="slot-sub">Afternoon</div>
      </button>
    </div>
 
    <h3 class="section-heading">Your Address</h3>
    <div class="input-wrap select-wrap">
      <span class="icon">📍</span>
      <input type="text" id="pickup-address" value="Lubhoo, Lalitpur">
    </div>
 
    <button class="btn-primary" id="confirm-pickup-btn">✓ Confirm Pickup</button>
  </div>
 
  <nav class="bottom-nav">
    <a class="nav-item" href="dashboard.html">
      <span class="nav-icon">🏠</span><span>Home</span>
    </a>
    <a class="nav-item active" href="pickup.html">
      <span class="nav-icon">🚛</span><span>Pickup</span>
    </a>
    <a class="nav-item" href="report.html">
      <span class="nav-icon">⚠</span><span>Report</span>
    </a>
    <a class="nav-item" href="profile.html">
      <span class="nav-icon">👤</span><span>Profile</span>
    </a>
  </nav>
</div>
 
<div class="toast" id="toast"></div>
 
<script type="module" src="script.js"></script>
</body>
</html>
