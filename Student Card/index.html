<!DOCTYPE html>
<html>

<head>
    <title>Student Profile Card</title>

    <style>

        /* Body Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Card (ID Selector) */
        #profile-card {
            background-color: white;
            width: 320px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;

            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        /* Card Hover */
        #profile-card:hover {
            transform: translateY(-8px);
        }

        /* Student Image */
        .student-image {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 15px;
            transition: 0.3s;
        }

        /* Image Hover */
        .student-image:hover {
            transform: scale(1.05);
        }

        /* Name */
        .student-name {
            color: #333;
            font-size: 26px;
            margin: 10px 0;
        }

        /* Course */
        .student-course {
            color: #666;
            font-size: 18px;
            margin-bottom: 20px;
        }

        /* Button */
        .profile-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Button Hover */
        .profile-btn:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

    </style>
</head>

<body>

    <div id="profile-card">

        <!-- Your Image -->
        <img src="mypic.jpg"
             alt="Student Photo"
             class="student-image">

        <!-- Name -->
        <h2 class="student-name">Ankita Gautam</h2>

        <!-- Course -->
        <p class="student-course">
            Computer Science Student
        </p>

        <!-- Button -->
        <button class="profile-btn">
            View Profile
        </button>

    </div>

</body>

</html>
