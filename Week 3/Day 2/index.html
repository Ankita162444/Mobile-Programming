<!DOCTYPE html>
<html>
<head>
    <title>jQuery Callback Animation</title>

    <!-- jQuery Library -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        #box{
            width:100px;
            height:100px;
            background:red;
            position:relative;
        }

        button{
            padding:10px 20px;
            margin-bottom:20px;
        }
    </style>
</head>

<body>

    <button id="start">Start Animation</button>

    <div id="box"></div>

    <script>

        $(document).ready(function(){

            $("#start").click(function(){

                // Move to Bottom Left
                $("#box").animate({
                    left:"0px",
                    top:"300px"
                },1000,function(){

                    $(this).css("background","blue");

                    // Move to Bottom Right
                    $(this).animate({
                        left:"300px",
                        top:"300px"
                    },1000,function(){

                        $(this).css("background","green");

                        // Move to Bottom Left Again
                        $(this).animate({
                            left:"0px",
                            top:"300px"
                        },1000,function(){

                            $(this).css("background","orange");

                            // Move to Top Right
                            $(this).animate({
                                left:"300px",
                                top:"0px"
                            },1000,function(){

                                $(this).css("background","purple");

                                // Back to Original Position
                                $(this).animate({
                                    left:"0px",
                                    top:"0px"
                                },1000,function(){

                                    $(this).css("background","red");

                                    alert("Back to original position!");

                                });

                            });

                        });

                    });

                });

            });

        });

    </script>

</body>
</html>
