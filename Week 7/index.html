
Signin · HTML
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — SmartWaste</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
 
<div class="phone-frame">
  <div class="screen-content">
    <div class="brand-row">
      <span class="logo-icon">♻️</span>
      <span class="brand-name">SmartWaste</span>
    </div>
 
    <h1 class="welcome-title">Welcome</h1>
    <h2 class="form-title">Sign In</h2>
 
    <form id="signin-form">
      <label class="field-label" for="email">Email</label>
      <div class="input-wrap">
        <span class="icon">✉</span>
        <input type="email" id="email" placeholder="" value="ankita@gmail.com">
      </div>
 
      <label class="field-label" for="password">Password</label>
      <div class="input-wrap">
        <span class="icon">🔒</span>
        <input type="password" id="password" placeholder="" value="password123">
        <span class="icon icon-right" id="toggle-password">👁</span>
      </div>
 
      <button type="submit" class="btn-primary">Sign In <span class="arrow">→</span></button>
    </form>
 
    <div class="divider"><span>OR Continue With</span></div>
 
    <div class="social-row">
      <button class="social-btn" aria-label="Continue with Facebook">f</button>
      <button class="social-btn" aria-label="Continue with LinkedIn">in</button>
    </div>
 
    <p class="signup-row">Don't have an account? <a href="#">Sign Up</a></p>
  </div>
</div>
 
<div class="toast" id="toast"></div>
 
<script type="module" src="script.js"></script>
</body>
</html>
